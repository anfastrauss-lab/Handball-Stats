# Jede Woche eine verschlüsselte Sicherung der Spielerübersicht (Akten, Techniktests, Änderungsverlauf)
# aus dem Zentralspeicher in den Ordner «sicherung» legen. Ohne eingerichteten Zentralspeicher passiert nichts.
name: Sicherung

on:
  schedule:
    - cron: '15 3 * * 0'   # jeden Sonntag um 03:15 UTC
  workflow_dispatch:       # Knopf «Run workflow» im Reiter Actions

permissions:
  contents: write

concurrency:
  group: sicherung
  cancel-in-progress: false

jobs:
  sicherung:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sicherung erstellen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SICHERUNG_EMAIL: ${{ secrets.SICHERUNG_EMAIL }}
          SICHERUNG_PASSWORD: ${{ secrets.SICHERUNG_PASSWORD }}
          SCOUT_PASSWORD: ${{ secrets.SCOUT_PASSWORD }}
        run: node "$( [ -f tools/sicherung.mjs ] && echo tools/sicherung.mjs || echo sicherung.mjs )"

      - name: Sicherung im Projekt speichern
        run: |
          git config user.name "sicherung"
          git config user.email "actions@users.noreply.github.com"
          neu=$(ls -t sicherung/sicherung-*.enc 2>/dev/null | head -1)
          if [ -z "$neu" ]; then echo "Keine neue Sicherung zu speichern."; exit 0; fi
          cp "$neu" "$RUNNER_TEMP/sicherung.neu"; name=$(basename "$neu")
          for versuch in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p sicherung
            cp "$RUNNER_TEMP/sicherung.neu" "sicherung/$name"
            git add sicherung
            if git diff --cached --quiet; then echo "Keine Änderung zu speichern."; exit 0; fi
            git commit -m "Sicherung"
            if git push origin HEAD:main; then exit 0; fi
            echo "Speichern ging nicht (Versuch $versuch), neuer Anlauf …"; sleep $((versuch * 3))
          done
          echo "Das Speichern ist fünfmal gescheitert."; exit 1
